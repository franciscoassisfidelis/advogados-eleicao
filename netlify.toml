[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Cadastramento encerrado: a raiz exibe a página de encerramento.
# Para reabrir o formulário, remova estas duas regras.
[[redirects]]
  from = "/"
  to = "/encerrado.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/encerrado.html"
  status = 200
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
