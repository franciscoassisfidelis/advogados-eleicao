<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Login — Coordenação Jurídica</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-marca">
        <div class="selo">⚖</div>
        <h1>Coordenação Jurídica</h1>
      </div>
      <p class="subtitulo">Acesso restrito — cadastro de advogados do dia da eleição</p>

      <form id="form-login">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username" />

        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password" />

        <div id="login-erro" class="login-erro"></div>

        <button type="submit" id="btn-login">Entrar</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
